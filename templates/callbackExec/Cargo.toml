[package]
name = "callbackExec"
version = "0.1.0"
edition = "2021"

{{DLL_FORMAT}}

[dependencies]
dyncvoke = { git = "https://git.smukx.site/smukx/Dyncvoke" }
{{DEPENDENCIES}}

[dependencies.windows-sys]
version = "0.61"

features = [
    "Win32_System_Memory",
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_Threading",
    "Win32_System_Com",
    "Win32_System_Registry",
    "Win32_System_LibraryLoader",
    "Win32_System_StationsAndDesktops",
    "Win32_Globalization",
    "Win32_UI_Shell",
    "Win32_UI_Shell_Common",
]

[profile.release]
strip = true
opt-level = "z"
codegen-units = 1
panic = "abort"
lto = true
