[package]
name = "rustypacker"
version = "0.1.5"
edition = "2021"
authors = ["@5mukx"]
description = "Shellcode packer with fiber and earlycascade loaders."
license = "MIT OR Apache-2.0"

[[bin]]
name = "rustypacker"
path = "src/main.rs"

[dependencies]
eframe = { version = "0.27", features = ["persistence"] }
egui = "0.27"
rfd = "0.14"
serde = { version = "1", features = ["derive"] }
thiserror = "1"
getrandom = "0.2"
aes = "0.8"
ctr = "0.9"
k256 = { version = "0.13", features = ["ecdh", "arithmetic"] }
sha2 = "0.10"
rand_core = { version = "0.6", features = ["std"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = "symbols"
