[package]
name = "RustPacker"
version = "0.1.3"
edition = "2021"
authors = ["smukx <staffs@5mukx.site>"]

[lib]
name = "rustpacker"
path = "src/lib.rs"

[[bin]]
name = "RustPacker"
path = "src/bin/gui.rs"

[build-dependencies]
toml = "0.8"
serde = { version = "1", features = ["derive"] }

[dependencies]
path-absolutize = "3"
fs_extra = "1"
path-clean = "1"
rand = "0.10"
libaes = "0.7"
anyhow = "1"
serde = { version = "1", features = ["derive"] }
toml = "0.8"
eframe = { version = "0.27", features = ["persistence"] }
egui = "0.27"
rfd = "0.14"
